[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gth_solver"
version = "12.0.0"
authors = [
  { name="Taquan A. Abram", email="taquan.abram@example.com" },
]
description = "Open-Source Physics Solver for Geotopological Hydrodynamics (GTH v12.0)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "matplotlib>=3.8.0",
]
